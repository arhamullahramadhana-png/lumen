  <meta charset="UTF-8">

<body>
<!-- DUNIA: Pelat Spektrum (seed 4a66d831). Lihat komentar kontrak di index.html. FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, , and every shipping raster carrying its provenance -->
  <header class="nav" id="nav"></header>

  <main>
    <div class="form-card">
      <p class="mono mono-amber" style="margin-bottom:0.6rem">Daftar</p>
      <h1>Buka Dashboard</h1>
      <p class="form-sub">Gratis — simpan gambar favorit dan tandai artikel yang Anda sukai.</p>

      <div class="form-errors" id="errors" role="alert"></div>

      <form id="form-daftar" novalidate>
        <div class="field">
          <label for="name">Nama lengkap</label>
          <input id="name" name="name" type="text" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username"
                 placeholder="huruf, angka, underscore" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="new-password"
                 placeholder="minimal 6 karakter" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Daftar</button>
      </form>

      <p class="form-alt">
        Sudah punya akun? <a href="login.html">Masuk di sini</a>
      </p>
    </div>
  </main>

  <footer class="footer" id="footer"></footer>

  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script src="js/daftar.js"></script>
</body>
</html>
