<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk — Lumen</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230d1118'/%3E%3Crect x='6' y='6' width='20' height='5' fill='%23f0b429'/%3E%3Crect x='6' y='14' width='20' height='3' fill='%236fc7d4'/%3E%3Crect x='6' y='20' width='20' height='2' fill='%23d97a9e'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700;800;900&family=Public+Sans:wght@300;400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="nav" id="nav"></header>

  <main>
    <div class="form-card">
      <p class="mono mono-amber" style="margin-bottom:0.6rem">Masuk</p>
      <h1>Lemari Anda menunggu</h1>
      <p class="form-sub">Masuk untuk melanjutkan menelusuri arsip.</p>

      <div class="form-errors" id="errors" role="alert"></div>

      <form id="form-login" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Masuk</button>
      </form>

      <p class="form-alt">
        Belum punya akun? <a href="daftar.html">Daftar di sini</a>
      </p>
    </div>
  </main>

  <footer class="footer" id="footer"></footer>

  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
