<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard — Lumen</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230d1118'/%3E%3Crect x='6' y='6' width='20' height='5' fill='%23f0b429'/%3E%3Crect x='6' y='14' width='20' height='3' fill='%236fc7d4'/%3E%3Crect x='6' y='20' width='20' height='2' fill='%23d97a9e'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700;800;900&family=Public+Sans:wght@300;400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<body>
<!-- DUNIA: Pelat Spektrum (seed 4a66d831). Lihat komentar kontrak di index.html. FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, , and every shipping raster carrying its provenance -->
  <header class="nav" id="nav"></header>

  <main>
    <div class="page-head container">
      <h1 id="salam">Halo.</h1>
      <p class="section-lead">Simpan gambar dan artikel favorit ke dashboard pribadi anda.</p>
    </div>

    <section class="section" style="padding-top:1.5rem">
      <div class="container dash-grid">
        <aside class="panel">
          <div class="profile-head">
            <span class="profile-avatar" id="avatar" aria-hidden="true">?</span>
            <div>
              <b id="p-nama">—</b>
              <span id="p-username">—</span>
            </div>
          </div>
          <div class="profile-meta">
            <div>Email: <b id="p-email">—</b></div>
            <div>Bergabung: <b id="p-gabung">—</b></div>
          </div>
          <p style="margin:1.2rem 0 0">
            <button class="btn btn-line btn-sm" id="btn-keluar">Keluar</button>
          </p>
        </aside>

        <div>
          <div class="stat-row">
            <div class="stat"><b id="s-fav">0</b><span>Pelat disimpan</span></div>
            <div class="stat"><b id="s-like">0</b><span>Artikel disukai</span></div>
          </div>

          <div class="panel" style="margin-bottom:18px">
            <h2>Gambar disimpan</h2>
            <ul class="mini-list" id="list-fav"></ul>
          </div>

          <div class="panel">
            <h2>artikel disukai</h2>
            <ul class="mini-list" id="list-like"></ul>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer" id="footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
